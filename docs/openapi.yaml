openapi: 3.1.0
info:
  title: EGT GDA Sync API
  description: The local HTTP API of EGT GDA Sync. It answers only requests to a loopback
    host; requests other than GET and HEAD need the session token that GET /api/session
    returns, in the X-GDA-Token header.
  version: 2.1.3
components:
  schemas:
    Area:
      properties:
        x:
          type: integer
          maximum: 65535.0
          minimum: 0.0
          title: X
        y:
          type: integer
          maximum: 65535.0
          minimum: 0.0
          title: Y
        w:
          type: integer
          maximum: 65535.0
          minimum: 1.0
          title: W
        h:
          type: integer
          maximum: 65535.0
          minimum: 1.0
          title: H
      additionalProperties: false
      type: object
      required:
      - x
      - y
      - w
      - h
      title: Area
    DeclarationBody:
      properties:
        asset:
          type: string
          maxLength: 4096
          title: Asset
        kind:
          type: string
          enum:
          - Image
          - ImageSequence
          - AudioEvent
          - Font
          - Rtf
          - Element
          - Movie
          - IData
          - RawFile
          title: Kind
        descriptor:
          type: string
          maxLength: 4096
          title: Descriptor
        id:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Id
        resolution:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Resolution
        language:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Language
        integration:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Integration
        source:
          anyOf:
          - $ref: '#/components/schemas/Area'
          - type: 'null'
        frameTime:
          anyOf:
          - type: integer
            maximum: 600000.0
            minimum: 1.0
          - type: 'null'
          title: Frametime
        loopCount:
          anyOf:
          - type: integer
            maximum: 1000000.0
            minimum: 0.0
          - type: 'null'
          title: Loopcount
        loopTo:
          anyOf:
          - type: integer
            maximum: 1000000.0
            minimum: 0.0
          - type: 'null'
          title: Loopto
        polyphonyGroup:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Polyphonygroup
        loop:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Loop
        fadeIn:
          anyOf:
          - type: number
            maximum: 3600.0
            minimum: 0.0
          - type: 'null'
          title: Fadein
        fadeOut:
          anyOf:
          - type: number
            maximum: 3600.0
            minimum: 0.0
          - type: 'null'
          title: Fadeout
        chars:
          anyOf:
          - type: string
            maxLength: 4096
            minLength: 1
          - type: 'null'
          title: Chars
        size:
          anyOf:
          - type: integer
            maximum: 4096.0
            minimum: 1.0
          - type: 'null'
          title: Size
        movieFormat:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Movieformat
        dataType:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Datatype
      additionalProperties: false
      type: object
      required:
      - asset
      - kind
      - descriptor
      title: DeclarationBody
      description: 'A new descriptor entry for an asset of the asset report that no
        descriptor declares: its kind, the descriptor

        that holds it, relative to the game folder, and the values of its fields;
        those its kind does not have are refused.'
    Error:
      properties:
        error:
          type: string
          title: Error
      type: object
      required:
      - error
      title: Error
    GameEventBody:
      properties:
        event:
          type: string
          enum:
          - roundStarting
          - roundEnded
          - takeCoinsPressed
          - cashoutPressed
          - gamblePressed
          title: Event
        roundType:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Roundtype
          default: 0
        idle:
          type: boolean
          title: Idle
        nextRoundType:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Nextroundtype
          default: 0
        currencies:
          items:
            prefixItems:
            - type: integer
              maximum: 1000.0
              minimum: 0.0
            - type: integer
              maximum: 4.611686018427388e+18
              minimum: -4.611686018427388e+18
            type: array
            maxItems: 2
            minItems: 2
          type: array
          maxItems: 64
          title: Currencies
          default: []
      additionalProperties: false
      type: object
      required:
      - event
      - idle
      title: GameEventBody
      description: What the game did that its debug tools follow, and what they read
        of the game then.
    GameExportBody:
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          title: Name
        files:
          additionalProperties:
            type: string
          propertyNames:
            maxLength: 4096
          type: object
          maxProperties: 500
          minProperties: 1
          title: Files
        copies:
          additionalProperties:
            type: string
            maxLength: 4096
          propertyNames:
            maxLength: 4096
          type: object
          maxProperties: 500
          title: Copies
          default: {}
      additionalProperties: false
      type: object
      required:
      - name
      - files
      title: GameExportBody
      description: The files that the browser game generates, by their paths relative
        to the export's folder.
    GameExportFileBody:
      properties:
        id:
          type: string
          maxLength: 100
          title: Id
        file:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: File
      additionalProperties: false
      type: object
      required:
      - id
      title: GameExportFileBody
      description: An export of the browser game, by its id (its folder name), and
        a file of it, by its path in the export.
    GameImportBody:
      properties:
        files:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 200
          title: Files
          default: []
      additionalProperties: false
      type: object
      title: GameImportBody
      description: 'Ported TypeScript files of the browser game whose C++ changes
        to port (none: all of them).'
    GameImportGameBody:
      properties:
        plugin:
          type: string
          maxLength: 64
          title: Plugin
        files:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 200
          title: Files
          default: []
        copiesOnly:
          type: boolean
          title: Copiesonly
          default: false
      additionalProperties: false
      type: object
      required:
      - plugin
      title: GameImportGameBody
      description: 'A C++ game of the family to import (its plugin folder), and the
        TypeScript files of it to port (none: all).'
    GameScreenshotBody:
      properties:
        image:
          type: string
          maxLength: 22369624
          minLength: 1
          title: Image
      additionalProperties: false
      type: object
      required:
      - image
      title: GameScreenshotBody
      description: 'A screenshot of the browser game''s screen: a PNG image, in base64.'
    GameSourceBody:
      properties:
        file:
          type: string
          maxLength: 4096
          title: File
        line:
          type: integer
          maximum: 2147483647.0
          minimum: 1.0
          title: Line
      additionalProperties: false
      type: object
      required:
      - file
      - line
      title: GameSourceBody
      description: A line of a TypeScript or Vue file of the browser game, by its
        path in frontend/src/game.
    GameTranslateBody:
      properties:
        files:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 200
          minItems: 1
          title: Files
      additionalProperties: false
      type: object
      required:
      - files
      title: GameTranslateBody
      description: TypeScript files of the browser game, by their paths in frontend/src/game.
    ImageJobBody:
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
          title: Id
      additionalProperties: false
      type: object
      required:
      - id
      title: ImageJobBody
    ImageJobRetryBody:
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
          title: Id
        force:
          type: boolean
          title: Force
          default: false
      additionalProperties: false
      type: object
      required:
      - id
      title: ImageJobRetryBody
    ImageJobsBody:
      properties:
        kind:
          type: string
          enum:
          - metadata
          - image
          title: Kind
        assets:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 10000
          title: Assets
          default: []
        files:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 10000
          title: Files
          default: []
        overwrite:
          type: boolean
          title: Overwrite
          default: false
      additionalProperties: false
      type: object
      required:
      - kind
      title: ImageJobsBody
    ImageSettingsBody:
      properties:
        settings:
          additionalProperties: true
          type: object
          title: Settings
      additionalProperties: false
      type: object
      required:
      - settings
      title: ImageSettingsBody
    MetadataBody:
      properties:
        file:
          type: string
          maxLength: 4096
          title: File
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        revision:
          type: string
          maxLength: 64
          title: Revision
          default: ''
      additionalProperties: false
      type: object
      required:
      - file
      - metadata
      title: MetadataBody
    MoveBody:
      properties:
        assets:
          anyOf:
          - items:
              type: string
              maxLength: 4096
            type: array
            maxItems: 10000
            minItems: 1
          - type: 'null'
          title: Assets
        folder:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Folder
        target:
          type: string
          maxLength: 4096
          title: Target
          default: ''
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Name
        fingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Fingerprint
      additionalProperties: false
      type: object
      required:
      - fingerprint
      title: MoveBody
    MovePreviewBody:
      properties:
        assets:
          anyOf:
          - items:
              type: string
              maxLength: 4096
            type: array
            maxItems: 10000
            minItems: 1
          - type: 'null'
          title: Assets
        folder:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Folder
        target:
          type: string
          maxLength: 4096
          title: Target
          default: ''
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Name
      additionalProperties: false
      type: object
      title: MovePreviewBody
    OpenDeclarationBody:
      properties:
        descriptor:
          type: string
          maxLength: 4096
          title: Descriptor
        line:
          type: integer
          maximum: 2147483647.0
          minimum: 1.0
          title: Line
      additionalProperties: false
      type: object
      required:
      - descriptor
      - line
      title: OpenDeclarationBody
    OpenFolderBody:
      properties:
        folder:
          type: string
          enum:
          - source
          - destination
          title: Folder
      additionalProperties: false
      type: object
      required:
      - folder
      title: OpenFolderBody
    OpenViewElementBody:
      properties:
        file:
          type: string
          maxLength: 4096
          title: File
        index:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          title: Index
      additionalProperties: false
      type: object
      required:
      - file
      - index
      title: OpenViewElementBody
    RemoveAssetBody:
      properties:
        asset:
          type: string
          maxLength: 4096
          title: Asset
        confirmUsed:
          type: boolean
          title: Confirmused
          default: false
      additionalProperties: false
      type: object
      required:
      - asset
      title: RemoveAssetBody
      description: 'An asset of the asset report to remove from the game: its declarations
        and its files. One whose RssKeys views use

        is removed only with confirmUsed.'
    RenameKeyBody:
      properties:
        kind:
          type: string
          maxLength: 200
          minLength: 1
          title: Kind
        key:
          type: string
          maxLength: 200
          minLength: 1
          title: Key
        newKey:
          type: string
          maxLength: 200
          title: Newkey
        excluded:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 10000
          title: Excluded
          default: []
        fingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Fingerprint
      additionalProperties: false
      type: object
      required:
      - kind
      - key
      - newKey
      - fingerprint
      title: RenameKeyBody
    RenameKeyPreviewBody:
      properties:
        kind:
          type: string
          maxLength: 200
          minLength: 1
          title: Kind
        key:
          type: string
          maxLength: 200
          minLength: 1
          title: Key
        newKey:
          type: string
          maxLength: 200
          title: Newkey
        excluded:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 10000
          title: Excluded
          default: []
      additionalProperties: false
      type: object
      required:
      - kind
      - key
      - newKey
      title: RenameKeyPreviewBody
    ReportFileBody:
      properties:
        file:
          type: string
          maxLength: 512
          minLength: 6
          pattern: ^[^/\\]+\.json$
          title: File
      additionalProperties: false
      type: object
      required:
      - file
      title: ReportFileBody
    ResourceAction:
      properties:
        id:
          type: string
          maxLength: 4096
          title: Id
        category:
          type: string
          enum:
          - different
          - invalid
          - supplementary
          title: Category
        gdaFile:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Gdafile
      additionalProperties: false
      type: object
      required:
      - id
      - category
      title: ResourceAction
    ResourceActionsBody:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ResourceAction'
          type: array
          maxItems: 10000
          minItems: 1
          title: Resources
      additionalProperties: false
      type: object
      required:
      - resources
      title: ResourceActionsBody
    ResourceFileBody:
      properties:
        file:
          type: string
          maxLength: 4096
          title: File
      additionalProperties: false
      type: object
      required:
      - file
      title: ResourceFileBody
    ResourceFilesBody:
      properties:
        files:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 1000
          minItems: 1
          title: Files
        chars:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 20
          title: Chars
          default: []
      additionalProperties: false
      type: object
      required:
      - files
      title: ResourceFilesBody
    ResourceFolderBody:
      properties:
        file:
          type: string
          maxLength: 4096
          title: File
        isFolder:
          type: boolean
          title: Isfolder
          default: false
      additionalProperties: false
      type: object
      required:
      - file
      title: ResourceFolderBody
    RestoreBody:
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: Id
        files:
          anyOf:
          - items:
              type: string
              maxLength: 4096
            type: array
            maxItems: 100000
          - type: 'null'
          title: Files
      additionalProperties: false
      type: object
      required:
      - id
      title: RestoreBody
    RngEntryBody:
      properties:
        id:
          type: integer
          minimum: 1.0
          title: Id
      additionalProperties: false
      type: object
      required:
      - id
      title: RngEntryBody
      description: A queued RNG sequence, by its id.
    RngMoveBody:
      properties:
        id:
          type: integer
          minimum: 1.0
          title: Id
        before:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Before
      additionalProperties: false
      type: object
      required:
      - id
      title: RngMoveBody
      description: 'Where a queued sequence goes: before the sequence of this id,
        or to the end.'
    RngNumberBody:
      properties:
        op:
          type: integer
          maximum: 65535.0
          minimum: 0.0
          title: Op
        range:
          type: integer
          maximum: 4294967296.0
          minimum: 0.0
          title: Range
        value:
          type: integer
          exclusiveMaximum: 4294967296.0
          minimum: 0.0
          title: Value
      additionalProperties: false
      type: object
      required:
      - op
      - range
      - value
      title: RngNumberBody
      description: 'A number of an RNG sequence (GameCore::RngNumber): the operation
        that asks for it, its range and its value.'
    RngRandomsBody:
      properties:
        count:
          type: integer
          maximum: 4096.0
          minimum: 1.0
          title: Count
      additionalProperties: false
      type: object
      required:
      - count
      title: RngRandomsBody
    RngRoundBody:
      properties:
        roundType:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Roundtype
      additionalProperties: false
      type: object
      required:
      - roundType
      title: RngRoundBody
    RngSequenceBody:
      properties:
        roundType:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Roundtype
        name:
          type: string
          maxLength: 400
          title: Name
          default: ''
        sequence:
          items:
            $ref: '#/components/schemas/RngNumberBody'
          type: array
          maxItems: 4096
          title: Sequence
      additionalProperties: false
      type: object
      required:
      - roundType
      - sequence
      title: RngSequenceBody
      description: 'An RNG sequence to queue: its round type, its name (a scenario''s
        is tagged) and its numbers.'
    RngSequencesBody:
      properties:
        sequences:
          items:
            $ref: '#/components/schemas/RngSequenceBody'
          type: array
          maxItems: 1000
          minItems: 1
          title: Sequences
      additionalProperties: false
      type: object
      required:
      - sequences
      title: RngSequencesBody
    SettingsBody:
      properties:
        name:
          type: string
          maxLength: 80
          title: Name
        source:
          type: string
          maxLength: 4096
          title: Source
        destination:
          type: string
          maxLength: 4096
          title: Destination
      additionalProperties: false
      type: object
      required:
      - name
      - source
      - destination
      title: SettingsBody
    SyncBody:
      properties:
        ids:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 10000
          minItems: 1
          title: Ids
        gdaFiles:
          additionalProperties:
            type: string
            maxLength: 4096
          propertyNames:
            maxLength: 4096
          type: object
          maxProperties: 10000
          title: Gdafiles
          default: {}
      additionalProperties: false
      type: object
      required:
      - ids
      title: SyncBody
    TextFileBody:
      properties:
        file:
          type: string
          maxLength: 4096
          title: File
        text:
          type: string
          maxLength: 1048576
          title: Text
        revision:
          type: string
          maxLength: 64
          minLength: 1
          title: Revision
      additionalProperties: false
      type: object
      required:
      - file
      - text
      - revision
      title: TextFileBody
      description: The new text of a text file of the game's resources, and the revision
        of the file it was edited from.
    ViewLayoutBody:
      properties:
        workspace:
          type: string
          maxLength: 4096
          title: Workspace
        image:
          type: string
          maxLength: 22369624
          minLength: 1
          title: Image
        instructions:
          type: string
          maxLength: 8000
          title: Instructions
          default: ''
        model:
          type: string
          enum:
          - opus
          - sonnet
          - haiku
          title: Model
          default: haiku
      additionalProperties: false
      type: object
      required:
      - workspace
      - image
      title: ViewLayoutBody
    ViewPosition:
      properties:
        index:
          type: integer
          maximum: 100000.0
          minimum: 0.0
          title: Index
        x:
          type: number
          maximum: 1000000.0
          minimum: -1000000.0
          title: X
        y:
          type: number
          maximum: 1000000.0
          minimum: -1000000.0
          title: Y
      additionalProperties: false
      type: object
      required:
      - index
      - x
      - y
      title: ViewPosition
    ViewPositionsBody:
      properties:
        file:
          type: string
          maxLength: 4096
          title: File
        revision:
          type: string
          maxLength: 64
          minLength: 1
          title: Revision
        positions:
          items:
            $ref: '#/components/schemas/ViewPosition'
          type: array
          maxItems: 10000
          minItems: 1
          title: Positions
      additionalProperties: false
      type: object
      required:
      - file
      - revision
      - positions
      title: ViewPositionsBody
    WorkspaceBody:
      properties:
        id:
          type: string
          maxLength: 4096
          title: Id
      additionalProperties: false
      type: object
      required:
      - id
      title: WorkspaceBody
  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not a same-site request to a loopback host or, for a method other
        than GET and HEAD, no valid X-GDA-Token header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ContentTooLarge:
      description: The request body is larger than 128 KiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: The operation could not be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:

  # ─── Session ────────────────────────────────────────────────────────
  /api/session:
    get:
      summary: Session
      operationId: session_api_session_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Session
  /api/lifecycle:
    get:
      summary: Lifecycle
      operationId: lifecycle_api_lifecycle_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Session
  /api/shutdown:
    post:
      summary: Shutdown
      operationId: shutdown_api_shutdown_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Shutdown Api Shutdown Post
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Session
  /api/health:
    get:
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Api Health Get
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
