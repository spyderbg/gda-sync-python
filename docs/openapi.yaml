openapi: 3.1.0
info:
  title: EGT GDA Sync API
  description: The local HTTP API of EGT GDA Sync. It answers only requests to a loopback
    host; requests other than GET and HEAD need the session token that GET /api/session
    returns, in the X-GDA-Token header.
  version: 1.0.0
components:
  schemas:
    Area:
      properties:
        x:
          type: integer
          maximum: 65535.0
          minimum: 0.0
          title: X
        y:
          type: integer
          maximum: 65535.0
          minimum: 0.0
          title: Y
        w:
          type: integer
          maximum: 65535.0
          minimum: 1.0
          title: W
        h:
          type: integer
          maximum: 65535.0
          minimum: 1.0
          title: H
      additionalProperties: false
      type: object
      required:
      - x
      - y
      - w
      - h
      title: Area
    DeclarationBody:
      properties:
        asset:
          type: string
          maxLength: 4096
          title: Asset
        kind:
          type: string
          enum:
          - Image
          - ImageSequence
          - AudioEvent
          - Font
          - Rtf
          - Element
          - Movie
          - IData
          - RawFile
          title: Kind
        descriptor:
          type: string
          maxLength: 4096
          title: Descriptor
        id:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Id
        resolution:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Resolution
        language:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Language
        integration:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Integration
        source:
          anyOf:
          - $ref: '#/components/schemas/Area'
          - type: 'null'
        frameTime:
          anyOf:
          - type: integer
            maximum: 600000.0
            minimum: 1.0
          - type: 'null'
          title: Frametime
        loopCount:
          anyOf:
          - type: integer
            maximum: 1000000.0
            minimum: 0.0
          - type: 'null'
          title: Loopcount
        loopTo:
          anyOf:
          - type: integer
            maximum: 1000000.0
            minimum: 0.0
          - type: 'null'
          title: Loopto
        polyphonyGroup:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Polyphonygroup
        loop:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Loop
        fadeIn:
          anyOf:
          - type: number
            maximum: 3600.0
            minimum: 0.0
          - type: 'null'
          title: Fadein
        fadeOut:
          anyOf:
          - type: number
            maximum: 3600.0
            minimum: 0.0
          - type: 'null'
          title: Fadeout
        chars:
          anyOf:
          - type: string
            maxLength: 4096
            minLength: 1
          - type: 'null'
          title: Chars
        size:
          anyOf:
          - type: integer
            maximum: 4096.0
            minimum: 1.0
          - type: 'null'
          title: Size
        movieFormat:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Movieformat
        dataType:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Datatype
      additionalProperties: false
      type: object
      required:
      - asset
      - kind
      - descriptor
      title: DeclarationBody
      description: 'A new descriptor entry for an asset of the asset report that no
        descriptor declares: its kind, the descriptor

        that holds it, relative to the game folder, and the values of its fields;
        those its kind does not have are refused.'
    Error:
      properties:
        error:
          type: string
          title: Error
      type: object
      required:
      - error
      title: Error
    MoveBody:
      properties:
        assets:
          anyOf:
          - items:
              type: string
              maxLength: 4096
            type: array
            maxItems: 10000
            minItems: 1
          - type: 'null'
          title: Assets
        folder:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Folder
        target:
          type: string
          maxLength: 4096
          title: Target
          default: ''
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Name
        fingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Fingerprint
      additionalProperties: false
      type: object
      required:
      - fingerprint
      title: MoveBody
    MovePreviewBody:
      properties:
        assets:
          anyOf:
          - items:
              type: string
              maxLength: 4096
            type: array
            maxItems: 10000
            minItems: 1
          - type: 'null'
          title: Assets
        folder:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Folder
        target:
          type: string
          maxLength: 4096
          title: Target
          default: ''
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Name
      additionalProperties: false
      type: object
      title: MovePreviewBody
    OpenDeclarationBody:
      properties:
        descriptor:
          type: string
          maxLength: 4096
          title: Descriptor
        line:
          type: integer
          maximum: 2147483647.0
          minimum: 1.0
          title: Line
      additionalProperties: false
      type: object
      required:
      - descriptor
      - line
      title: OpenDeclarationBody
    OpenFolderBody:
      properties:
        folder:
          type: string
          enum:
          - source
          - destination
          title: Folder
      additionalProperties: false
      type: object
      required:
      - folder
      title: OpenFolderBody
    OpenViewElementBody:
      properties:
        file:
          type: string
          maxLength: 4096
          title: File
        index:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          title: Index
      additionalProperties: false
      type: object
      required:
      - file
      - index
      title: OpenViewElementBody
    RemoveAssetBody:
      properties:
        asset:
          type: string
          maxLength: 4096
          title: Asset
        confirmUsed:
          type: boolean
          title: Confirmused
          default: false
      additionalProperties: false
      type: object
      required:
      - asset
      title: RemoveAssetBody
      description: 'An asset of the asset report to remove from the game: its declarations
        and its files. One whose RssKeys views use

        is removed only with confirmUsed.'
    RenameKeyBody:
      properties:
        kind:
          type: string
          maxLength: 200
          minLength: 1
          title: Kind
        key:
          type: string
          maxLength: 200
          minLength: 1
          title: Key
        newKey:
          type: string
          maxLength: 200
          title: Newkey
        excluded:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 10000
          title: Excluded
          default: []
        fingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Fingerprint
      additionalProperties: false
      type: object
      required:
      - kind
      - key
      - newKey
      - fingerprint
      title: RenameKeyBody
    RenameKeyPreviewBody:
      properties:
        kind:
          type: string
          maxLength: 200
          minLength: 1
          title: Kind
        key:
          type: string
          maxLength: 200
          minLength: 1
          title: Key
        newKey:
          type: string
          maxLength: 200
          title: Newkey
        excluded:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 10000
          title: Excluded
          default: []
      additionalProperties: false
      type: object
      required:
      - kind
      - key
      - newKey
      title: RenameKeyPreviewBody
    ReportFileBody:
      properties:
        file:
          type: string
          maxLength: 512
          minLength: 6
          pattern: ^[^/\\]+\.json$
          title: File
      additionalProperties: false
      type: object
      required:
      - file
      title: ReportFileBody
    ResourceAction:
      properties:
        id:
          type: string
          maxLength: 4096
          title: Id
        category:
          type: string
          enum:
          - different
          - invalid
          - supplementary
          title: Category
        gdaFile:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Gdafile
      additionalProperties: false
      type: object
      required:
      - id
      - category
      title: ResourceAction
    ResourceActionsBody:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ResourceAction'
          type: array
          maxItems: 10000
          minItems: 1
          title: Resources
      additionalProperties: false
      type: object
      required:
      - resources
      title: ResourceActionsBody
    ResourceFilesBody:
      properties:
        files:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 1000
          minItems: 1
          title: Files
        chars:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 20
          title: Chars
          default: []
      additionalProperties: false
      type: object
      required:
      - files
      title: ResourceFilesBody
    ResourceFolderBody:
      properties:
        file:
          type: string
          maxLength: 4096
          title: File
        isFolder:
          type: boolean
          title: Isfolder
          default: false
      additionalProperties: false
      type: object
      required:
      - file
      title: ResourceFolderBody
    RestoreBody:
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: Id
        files:
          anyOf:
          - items:
              type: string
              maxLength: 4096
            type: array
            maxItems: 100000
          - type: 'null'
          title: Files
      additionalProperties: false
      type: object
      required:
      - id
      title: RestoreBody
    SettingsBody:
      properties:
        name:
          type: string
          maxLength: 80
          title: Name
        source:
          type: string
          maxLength: 4096
          title: Source
        destination:
          type: string
          maxLength: 4096
          title: Destination
      additionalProperties: false
      type: object
      required:
      - name
      - source
      - destination
      title: SettingsBody
    SyncBody:
      properties:
        ids:
          items:
            type: string
            maxLength: 4096
          type: array
          maxItems: 10000
          minItems: 1
          title: Ids
        gdaFiles:
          additionalProperties:
            type: string
            maxLength: 4096
          propertyNames:
            maxLength: 4096
          type: object
          maxProperties: 10000
          title: Gdafiles
          default: {}
      additionalProperties: false
      type: object
      required:
      - ids
      title: SyncBody
    TextFileBody:
      properties:
        file:
          type: string
          maxLength: 4096
          title: File
        text:
          type: string
          maxLength: 1048576
          title: Text
        revision:
          type: string
          maxLength: 64
          minLength: 1
          title: Revision
      additionalProperties: false
      type: object
      required:
      - file
      - text
      - revision
      title: TextFileBody
      description: The new text of a text file of the game's resources, and the revision
        of the file it was edited from.
    ViewPosition:
      properties:
        index:
          type: integer
          maximum: 100000.0
          minimum: 0.0
          title: Index
        x:
          type: number
          maximum: 1000000.0
          minimum: -1000000.0
          title: X
        y:
          type: number
          maximum: 1000000.0
          minimum: -1000000.0
          title: Y
      additionalProperties: false
      type: object
      required:
      - index
      - x
      - y
      title: ViewPosition
    ViewPositionsBody:
      properties:
        file:
          type: string
          maxLength: 4096
          title: File
        revision:
          type: string
          maxLength: 64
          minLength: 1
          title: Revision
        positions:
          items:
            $ref: '#/components/schemas/ViewPosition'
          type: array
          maxItems: 10000
          minItems: 1
          title: Positions
      additionalProperties: false
      type: object
      required:
      - file
      - revision
      - positions
      title: ViewPositionsBody
    WorkspaceBody:
      properties:
        id:
          type: string
          maxLength: 4096
          title: Id
      additionalProperties: false
      type: object
      required:
      - id
      title: WorkspaceBody
  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not a same-site request to a loopback host or, for a method other
        than GET and HEAD, no valid X-GDA-Token header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ContentTooLarge:
      description: The request body is larger than 128 KiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: The operation could not be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:

  # ─── Session ────────────────────────────────────────────────────────
  /api/session:
    get:
      summary: Session
      operationId: session_api_session_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Session
  /api/lifecycle:
    get:
      summary: Lifecycle
      operationId: lifecycle_api_lifecycle_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Session
  /api/shutdown:
    post:
      summary: Shutdown
      operationId: shutdown_api_shutdown_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Shutdown Api Shutdown Post
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Session
  /api/health:
    get:
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Api Health Get
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Session

  # ─── Workspace ──────────────────────────────────────────────────────
  /api/library:
    get:
      summary: Library View
      operationId: library_view_api_library_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Library View Api Library Get
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Workspace
  /api/dashboard:
    get:
      summary: Dashboard View
      operationId: dashboard_view_api_dashboard_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Dashboard View Api Dashboard Get
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Workspace
  /api/scan:
    post:
      summary: Rescan
      operationId: rescan_api_scan_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Rescan Api Scan Post
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Workspace
  /api/sync:
    post:
      summary: Sync
      operationId: sync_api_sync_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Sync Api Sync Post
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Workspace
  /api/settings:
    put:
      summary: Settings
      operationId: settings_api_settings_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Settings Api Settings Put
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Workspace
  /api/workspace:
    put:
      summary: Select Workspace
      operationId: select_workspace_api_workspace_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Select Workspace Api Workspace Put
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Workspace
  /api/open-folder:
    post:
      summary: Open Folder
      operationId: open_folder_api_open_folder_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenFolderBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Open Folder Api Open Folder Post
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - Workspace

  # ─── GDA sync ───────────────────────────────────────────────────────
  /api/rss-sync:
    get:
      summary: Rss Sync Status
      operationId: rss_sync_status_api_rss_sync_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Rss Sync Status Api Rss Sync Get
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - GDA sync
  /api/rss-sync/history:
    get:
      summary: Rss Sync History
      operationId: rss_sync_history_api_rss_sync_history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Rss Sync History Api Rss Sync History Get
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - GDA sync
  /api/rss-sync/report:
    get:
      summary: Rss Sync Report
      operationId: rss_sync_report_api_rss_sync_report_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - GDA sync
  /api/rss-sync/delete-report:
    post:
      summary: Delete Rss Report
      operationId: delete_rss_report_api_rss_sync_delete_report_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportFileBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Delete Rss Report Api Rss Sync Delete Report Post
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - GDA sync
  /api/rss-sync/preview:
    get:
      summary: Rss Sync Preview
      operationId: rss_sync_preview_api_rss_sync_preview_get
      parameters:
      - name: file
        in: query
        required: true
        schema:
          type: string
          maxLength: 4096
          title: File
      - name: width
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 8192
            minimum: 16
          - type: 'null'
          title: Width
      - name: hidden
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Hidden
      - name: crop
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Crop
      - name: segment
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100000
            minimum: 0
          - type: 'null'
          title: Segment
      - name: cuts
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 8192
            pattern: ^(\d{1,6}(,\d{1,6})*)?$
          - type: 'null'
          title: Cuts
      - name: text
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Text
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - GDA sync
  /api/rss-sync/movie-frame:
    get:
      summary: Rss Sync Movie Frame
      operationId: rss_sync_movie_frame_api_rss_sync_movie_frame_get
      parameters:
      - name: file
        in: query
        required: true
        schema:
          type: string
          maxLength: 4096
          title: File
      - name: stacked
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Stacked
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      tags:
      - GDA sync
  /api/rss-sync/view:
    get:
      summary: Rss Sync View
