[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "egt-gda-sync"
dynamic = ["version"]
description = "A local-first studio asset sync application for Linux and Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# The GDA sync's GPU algorithms (use_gpu): CLIP and DINOv2 on a CUDA GPU. Not part of the packaged executables.
gpu = [
  "torch>=2.1",
  "transformers>=4.40",
]
dev = [
  "httpx2>=2.13",
  "pytest>=8",
  "playwright>=1.50",
  "pyinstaller>=6.10",
]

[project.scripts]
egt-gda-sync = "egt_gda_sync.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "egt_gda_sync.__version__" }

[tool.setuptools.packages.find]
include = ["egt_gda_sync*"]

[tool.setuptools.package-data]
egt_gda_sync = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: browser tests that need the built frontend and Playwright Chromium"]
